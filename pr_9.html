<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    
<form>
<table border="1" cellpadding="5" style="background-color: chocolate; color: antiquewhite;">
<tr>
    <td colspan="2" align="center"><input type="text" value="Register Form">
    </td>
</tr>
<tr>
    <td>first Name :</td><td><input type="text" placeholder="enter your firstname">
    </td>
</tr>
<tr>
    <td>last Name :</td><td><input type="text" placeholder="enter your lastname">
    </td>
</tr>
<tr>
    <td>contect NO :</td><td><input type="text" placeholder="enter your content NO">
    </td>
</tr>
<tr>
    <td>landline NO</td><td><input type="text" placeholder="enter your landline NO">
    </td>
</tr>
<tr>
    <td>Email :</td><td><input type="email">
    </td>
</tr>
<tr>
    <td>Password :</td><td><input type="password">
    </td>
</tr>
<tr>
    <td>Gender</td><td><input type="radio" name="gg"> Male <input type="radio" name="gg"> Female
    </td>
</tr>
<tr>
    <td>Date of birth:</td><td><input type="date">
    </td>
</tr>
<tr>
    <td>Address</td><td><textarea></textarea>
    </td>
</tr>
<tr>
    <td>country</td><td><select>
        <option value="usa">usa</option>
         <option value="india">india</option>
          <option value="uk">uk</option>
    </select>
    </td>
</tr>
<tr>
    <td colspan="2" align="center"><input type="submit" value="submit">
    </td>
</tr>

</table>
</form>
</body>
</html>
