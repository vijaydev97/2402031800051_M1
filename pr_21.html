<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting Eligibility</title>
</head>
<body>

    <p id="demo"></p>

    <script>

    number = prompt("enter number");

        if(number >= 0)
        {
            document.getElementById("demo").innerHTML =
            "positive number";
        }
        else
        {
            document.getElementById("demo").innerHTML =
            "negative number";
        }

    </script>

</body>
</html>
