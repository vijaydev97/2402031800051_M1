<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login</title>

    <style>
        body{
            font-family:Arial;
            background:#0e1116;
        }

        .box{
            width:300px;
            margin:100px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            text-align:center;
        }

        input{
            width:100%;
            padding:10px;
            margin:10px 0;
        }

        button{
            width:100%;
            padding:10px;
            background:#2874f0;
            color:white;
            border:none;
        }
    </style>
</head>

<body>

<div class="box">
    <h2>Login Page</h2>

    <input type="text" placeholder="Enter Email">

    <input type="password" placeholder="Enter Password">

    <button>Login</button>
</div>

</body>
</html>
