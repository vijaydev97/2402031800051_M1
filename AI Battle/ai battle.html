<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini vs OpenRouter</title>
  <link rel="stylesheet" href="ai battle.css">
</head>
<body>

<div class="container">
  <h1>🚀 Gemini vs OpenRouter</h1>

  <textarea id="prompt" placeholder="Enter your prompt..."></textarea>

  <button onclick="compareAI()">Compare</button>

  <div class="results">

    <div class="card">
      <h2>Gemini</h2>
      <p id="geminiTime"></p>
      <div id="geminiOutput">Waiting...</div>
    </div>

    <div class="card">
      <h2>OpenRouter</h2>
      <p id="openrouterTime"></p>
      <div id="openrouterOutput">Waiting...</div>
    </div>

  </div>
</div>

<script src="ai battle.js"></script>
</body>
</html>
