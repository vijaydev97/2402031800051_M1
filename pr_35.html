<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Validation</title>
</head>
<body>

<form name="myForm">

    Username:
    <input type="text" name="uname"><br><br>

    Password:
    <input type="password" name="pword"><br><br>

    <button onclick="f()">click</button> 

</form>

<script>
function f() {

    var a = document.forms["myForm"];

    var u = a.uname.value;

    var p = a.pword.value;

    if (u == "admin" && p == "123") {

        alert("Valid");

    } else {

        alert("Invalid");

    }
}
</script>

</body>
</html>
