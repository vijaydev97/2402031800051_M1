.product-card{

}

}

}

.product-card button{
    background:#ff9f00;
    color:white;
    border:none;
    padding:10px 20px;
    margin-bottom:15px;
    border-radius:5px;
    cursor:pointer;
    font-size:16px;
}

.product-card button:hover{
    background:#fb641b;
}

<script>

function addToCart(id,name,price){

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    let item = cart.find(product => product.id === id);

    if(item){
        item.quantity++;
    }
    else{
        cart.push({
            id:id,
            name:name,
            price:price,
            quantity:1
        });
    }

    localStorage.setItem("cart",JSON.stringify(cart));

    updateCount();

    alert("Added To Cart");
}

function updateCount(){

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    let totalItems = 0;

    cart.forEach(item=>{
        totalItems += item.quantity;
    });

    document.getElementById("count").innerText = totalItems;
}

updateCount();

</script>
