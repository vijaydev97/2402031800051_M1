<style>.products-container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:20px;
}

.product-card{
    width:220px;
    background:white;
    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
    text-align:center;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.product-card img{
    width:100%;
    height:180px;
    object-fit:cover;
    border-radius:8px;
}

.product-card h3{
    margin:10px 0;
}

.product-card p{
    color:#555;
    font-size:14px;
}

.product-card h2{
    color:green;
}

.product-card button{
    background:#ff9f00;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:5px;
    cursor:pointer;
}

.product-card button:hover{
    background:#fb641b;
}
</style>
