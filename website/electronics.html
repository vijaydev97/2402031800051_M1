<link rel="stylesheet" href="style.css">
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f1f3f6;
}


    

.nav-links a{
    color:white;
    text-decoration:none;
    margin-left:15px;
    font-weight:bold;
}

.banner{
    background:white;
    text-align:center;
    padding:40px;
    margin:20px;
    border-radius:10px;
}

.banner h1{
    color:#2874f0;
}

.products{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    padding:20px;
}

.card{
    background:white;
    width:220px;
    padding:15px;
    text-align:center;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.2);
}

.card img{
    width:100%;
    height:150px;
    border-radius:5px;
}

.card h3{
    margin:10px 0;
}

.card p{
    color:green;
    font-weight:bold;
}

.card button{
    background:#2874f0;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:5px;
    cursor:pointer;
}

.card button:hover{
    background:#0b57d0;
}

footer{
    background:#172337;
    color:white;
    text-align:center;
    padding:15px;
    margin-top:20px;
}
</style>

</head>
