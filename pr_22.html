<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting Eligibility</title>
</head>
<body>

    <p id="demo"></p>

    <script>

    number1 = prompt("enter number1");
    number2 = prompt("enter number2");

        if(number1 >= number2)
        {
            document.getElementById("demo").innerHTML =
            "number 1 greatest number 2";
        }
        else
        {
            document.getElementById("demo").innerHTML =
            "number 2 greatest number 1";
        }

    </script>

</body>
</html>
